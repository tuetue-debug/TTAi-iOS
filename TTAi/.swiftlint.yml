# SwiftLint Configuration for TTAi
# Based on Swift Style Guide and best practices

# Excluded paths
excluded:
  - Pods
  - Carthage
  - .build
  - DerivedData
  - TTAiTests
  - TTAiUITests
  - fastlane
  - .github

# Rules configuration
opt_in_rules:
  # Code style
  - closure_spacing
  - collection_alignment
  - contains_over_first_not_nil
  - empty_count
  - empty_string
  - fallthrough
  - fatal_error_message
  - first_where
  - identical_operands
  - implicit_return
  - last_where
  - legacy_random
  - literal_expression_end_indentation
  - multiline_arguments
  - multiline_function_chains
  - multiline_literal_brackets
  - multiline_parameters
  - operator_usage_whitespace
  - overridden_super_call
  - pattern_matching_keywords
  - prefer_self_type_over_type_of_self
  - redundant_nil_coalescing
  - redundant_type_annotation
  - strict_fileprivate
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - unused_import
  - vertical_whitespace_between_cases
  - vertical_whitespace_closing_braces
  - yoda_condition
  
  # Performance
  - discouraged_object_literal
  - explicit_self
  
  # Safety
  - force_unwrapping
  - implicitly_unwrapped_optional
  - notification_center_detachment
  - prohibited_super_call

# Disabled rules
disabled_rules:
  # These rules are too strict for our codebase
  - line_length
  - file_length
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  - nesting

# Rule configurations
analyzer_rules:
  - unused_import
  - unused_declaration

line_length:
  warning: 150
  error: 200
  ignores_comments: true
  ignores_urls: true

file_length:
  warning: 500
  error: 1000
  ignore_comment_only_lines: true

type_body_length:
  warning: 400
  error: 600

function_body_length:
  warning: 50
  error: 100

cyclomatic_complexity:
  warning: 15
  error: 25

nesting:
  type_level:
    warning: 3
    error: 4
  statement_level:
    warning: 5
    error: 8

identifier_name:
  min_length:
    warning: 2
    error: 1
  max_length:
    warning: 40
    error: 50
  excluded:
    - id
    - to
    - at
    - x
    - y
    - i
    - j
    - k

function_parameter_count:
  warning: 6
  error: 8

large_tuple:
  warning: 3
  error: 4

force_cast: warning
force_try: warning

trailing_whitespace:
  ignores_empty_lines: true
  ignores_comments: true

vertical_whitespace:
  max_empty_lines: 2

empty_count:
  only_after_dot: true

redundant_string_enum_value: error
redundant_optional_initialization: warning
redundant_set_access_control: warning
redundant_type_annotation: warning
redundant_void_return: warning

opening_brace:
  allow_multiline_func: true

closure_spacing: error
collection_alignment:
  align_colons: true

empty_string: error
fallthrough: error
fatal_error_message: error

implicit_return:
  included:
    - closure
    - getter
    - function
    - property

legacy_random: error
literal_expression_end_indentation: error

multiline_arguments:
  first_argument_location: next_line
  only_enforce_after_first_closure_on_first_line: true

multiline_function_chains:
  ignore_function_returning_closure: true

multiline_literal_brackets: error
multiline_parameters: error
operator_usage_whitespace: error

overridden_super_call:
  severity: error
  excluded:
    - viewDidLoad()
    - viewWillAppear(_:)
    - viewDidAppear(_:)
    - viewWillDisappear(_:)
    - viewDidDisappear(_:)

pattern_matching_keywords: error
prefer_self_type_over_type_of_self: error

redundant_nil_coalescing: error
strict_fileprivate: error
toggle_bool: error

unneeded_parentheses_in_closure_argument:
  severity: error

vertical_whitespace_between_cases: error
vertical_whitespace_closing_braces: error
yoda_condition: error

discouraged_object_literal:
  color_literal: warning
  image_literal: warning

explicit_self:
  severity: error

force_unwrapping:
  severity: warning

implicitly_unwrapped_optional:
  mode: all_except_iboutlets

notification_center_detachment: error
prohibited_super_call: error

# Custom rules
custom_rules:
  no_print_in_production:
    name: "No print in production"
    regex: '(?<!//.*)\bprint\('
    message: "Use proper logging instead of print statements"
    severity: warning
    
  no_force_unwrap_in_production:
    name: "Avoid force unwrap in production"
    regex: '!\s*$'
    message: "Avoid force unwrapping, use optional binding or default values"
    severity: warning
    
  no_magic_numbers:
    name: "No magic numbers"
    regex: '\b\d{2,}\b'
    message: "Extract magic numbers to constants"
    severity: warning
    match_kinds:
      - number
    
  todo_fixme_warning:
    name: "TODO/FIXME warnings"
    regex: '(TODO|FIXME|XXX|HACK|BUG)'
    message: "Address TODO/FIXME comments before production"
    severity: warning

# Reporter
reporter: "xcode"