name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode.app
    
    - name: Build
      run: |
        if [ -d "TTAi" ]; then
          cd TTAi
          echo "Listing available schemes..."
          xcodebuild -list || true
          echo "Building..."
          xcodebuild -scheme TTAi -destination 'platform=iOS Simulator,name=iPhone 15' build
        else
          echo "TTAi directory not found. Current directory:"
          pwd
          ls -la
          find . -name "*.xcodeproj" -o -name "*.xcworkspace"
        fi
    
    - name: Run Tests
      run: |
        if [ -d "TTAi" ]; then
          cd TTAi
          xcodebuild test -scheme TTAi -destination 'platform=iOS Simulator,name=iPhone 15' || echo "Tests may fail if no tests exist"
        fi
