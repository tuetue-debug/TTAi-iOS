name: iOS CI

on:
push:
branches: [ main ]
pull_request:
branches: [ main ]

jobs:
build:
runs-on: macos-latest

steps:
- uses: actions/checkout@v4

- name: Select Xcode
run: sudo xcode-select -switch /Applications/Xcode.app

- name: Build
run: |
cd TTAi
xcodebuild -scheme TTAi -destination 'platform=iOS Simulator,name=iPhone 15' build

- name: Run Tests
run: |
cd TTAi
xcodebuild test -scheme TTAi -destination 'platform=iOS Simulator,name=iPhone 15'
