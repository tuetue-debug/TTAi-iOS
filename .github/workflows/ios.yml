name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode.app
    
    - name: Build
      run: |
        echo "Current directory:"
        pwd
        echo "Listing contents:"
        ls -la
        if [ -d "TTAi" ]; then
          cd TTAi
          echo "Inside TTAi directory:"
          ls -la
          echo "Listing available schemes..."
          xcodebuild -list || true
          echo "Building..."
          xcodebuild -scheme TTAi -destination 'generic/platform=iOS Simulator' build
        else
          echo "TTAi directory not found."
          find . -name "*.xcodeproj" -o -name "*.xcworkspace"
        fi
    
    - name: Run Tests
      run: |
        if [ -d "TTAi" ]; then
          cd TTAi
          xcodebuild test -scheme TTAi -destination 'generic/platform=iOS Simulator' || echo "Tests may fail if no tests exist"
        fi
