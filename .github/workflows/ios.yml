name: iOS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Select Xcode
      run: sudo xcode-select -switch /Applications/Xcode.app
    
    - name: Build
      run: |
        echo "Current directory:"
        pwd
        echo "Listing contents:"
        ls -la
        echo "Looking for Xcode project..."
        find . -name "*.xcodeproj" -o -name "*.xcworkspace"
        echo "Building from current directory..."
        xcodebuild -list || true
        echo "Building..."
        xcodebuild -scheme TTAi -destination 'generic/platform=iOS Simulator' build
    
    - name: Run Tests
      run: |
        xcodebuild test -scheme TTAi -destination 'generic/platform=iOS Simulator' || echo "Tests may fail if no tests exist"
