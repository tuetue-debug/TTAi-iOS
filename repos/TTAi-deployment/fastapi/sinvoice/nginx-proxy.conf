# nginx-proxy.conf — Viettel S-Invoice reverse proxy (VPS option)
# Deploy trên matbao VPS nếu có quyền nginx config
# Subdomain: sinvoice.tuetue.vn → trỏ A record về matbao IP
#
# sudo cp nginx-proxy.conf /etc/nginx/sites-available/sinvoice.tuetue.vn
# sudo ln -s /etc/nginx/sites-available/sinvoice.tuetue.vn /etc/nginx/sites-enabled/
# sudo certbot --nginx -d sinvoice.tuetue.vn
# sudo nginx -s reload

server {
    listen 80;
    server_name sinvoice.tuetue.vn;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name sinvoice.tuetue.vn;

    # certbot sẽ tự thêm ssl_certificate khi chạy
    # ssl_certificate     /etc/letsencrypt/live/sinvoice.tuetue.vn/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/sinvoice.tuetue.vn/privkey.pem;

    # Chỉ cho phép từ TTAi server (thay IP thực)
    # allow xxx.xxx.xxx.xxx;
    # deny all;

    location / {
        # Strip /sinvoice prefix nếu có
        rewrite ^/sinvoice/(.*)$ /$1 break;

        proxy_pass          https://api-vinvoice.viettel.vn/services/einvoiceapplication/api;
        proxy_ssl_server_name on;
        proxy_set_header    Host api-vinvoice.viettel.vn;
        proxy_set_header    X-Real-IP $remote_addr;

        # Pass cookies through (Viettel dùng cookie auth)
        proxy_pass_header   Set-Cookie;
        proxy_cookie_domain api-vinvoice.viettel.vn sinvoice.tuetue.vn;

        proxy_connect_timeout 30s;
        proxy_read_timeout    90s;
        proxy_send_timeout    30s;

        proxy_buffering off;
    }
}
