<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTAi Control Dashboard</title>
    <link rel="stylesheet" href="./style.css?v=topology-mvp-20260408-0141">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="app">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <i class="fas fa-brain"></i>
                    <span>TTAi Control</span>
                </div>
                <button class="sidebar-toggle" id="sidebar-toggle" aria-label="Toggle sidebar">
                    <i class="fas fa-bars"></i>
                </button>
            </div>
            <nav class="sidebar-nav">
                <a href="#overview" class="nav-item active" data-page="overview">
                    <i class="fas fa-chart-line"></i>
                    <span>Overview</span>
                </a>
                <a href="#quota" class="nav-item" data-page="quota">
                    <i class="fas fa-shield-alt"></i>
                    <span>Quota</span>
                </a>
                <a href="#billing" class="nav-item" data-page="billing">
                    <i class="fas fa-credit-card"></i>
                    <span>Billing</span>
                </a>
                <a href="#errors" class="nav-item" data-page="errors">
                    <i class="fas fa-exclamation-triangle"></i>
                    <span>Errors</span>
                </a>
                <div class="nav-divider"></div>
                <a href="#models" class="nav-item" data-page="models">
                    <i class="fas fa-robot"></i>
                    <span>Models</span>
                </a>
                <a href="#system" class="nav-item" data-page="system">
                    <i class="fas fa-server"></i>
                    <span>System</span>
                </a>
                <a href="#usage" class="nav-item" data-page="usage">
                    <i class="fas fa-chart-bar"></i>
                    <span>Usage</span>
                </a>
                <a href="#topology" class="nav-item" data-page="topology">
                    <i class="fas fa-diagram-project"></i>
                    <span>Topology</span>
                </a>
                <a href="#about" class="nav-item" data-page="about">
                    <i class="fas fa-circle-info"></i>
                    <span>About</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <div class="status-indicator">
                    <div class="status-dot online"></div>
                    <span>API Connected</span>
                </div>
                <div class="version">v0.1.0</div>
            </div>
        </aside>

        <!-- Main content -->
        <main class="main">
            <!-- Top bar -->
            <header class="topbar">
                <div class="topbar-left">
                    <h1 class="page-title">Overview</h1>
                    <div class="breadcrumb">Dashboard</div>
                </div>
                <div class="topbar-right">
                    <div class="time-display" id="current-time">--:--</div>
                    <button class="btn-refresh" id="refresh-btn">
                        <i class="fas fa-sync-alt"></i>
                        Refresh
                    </button>
                    <button class="btn-refresh" id="logout-btn">
                        <i class="fas fa-sign-out-alt"></i>
                        Logout
                    </button>
                </div>
            </header>

            <!-- Page content -->
            <div class="page-content">
                <div id="page-overview" class="page active"></div>
                <div id="page-quota" class="page"></div>
                <div id="page-billing" class="page"></div>
                <div id="page-errors" class="page"></div>
                <div id="page-models" class="page"></div>
                <div id="page-system" class="page"></div>
                <div id="page-usage" class="page"></div>
                <div id="page-topology" class="page"></div>
                <div id="page-about" class="page"></div>
            </div>
        </main>
    </div>

    <script src="./app.js?v=topology-mvp-20260408-0141"></script>
</body>
</html>
